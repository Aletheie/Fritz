name: macOS app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install webkit
      - name: Verify onboarding and lessons in WebKit
        run: FRITZ_TEST_WEBKIT=1 pnpm exec playwright test tests/e2e/grammar.spec.ts tests/e2e/product-flows.spec.ts -g 'onboarding|setup survives|corrected grammar|consulted rule' --project=webkit
      - run: node --test --experimental-strip-types tests/desktop-bootstrap.test.ts
      - run: node scripts/package-macos.mjs --arch ${{ matrix.architecture }} --keep-app
      - run: node scripts/smoke-macos.mjs --app artifacts/release/macos-${{ matrix.architecture }}/Fritz.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Fritz-macOS-${{ matrix.architecture }}
          path: |
            artifacts/release/Fritz-macOS-${{ matrix.architecture }}.zip
            artifacts/release/Fritz-macOS-${{ matrix.architecture }}.zip.sha256
          if-no-files-found: error
