name: macOS app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install webkit
      - name: Verify onboarding and lessons in WebKit
        run: FRITZ_TEST_WEBKIT=1 pnpm exec playwright test tests/e2e/grammar.spec.ts tests/e2e/product-flows.spec.ts -g 'onboarding|setup survives|corrected grammar|consulted rule' --project=webkit
      - run: node --test --experimental-strip-types tests/desktop-bootstrap.test.ts
      - run: node scripts/package-macos.mjs --arch ${{ matrix.architecture }} --keep-app
      - run: node scripts/smoke-macos.mjs --app artifacts/release/macos-${{ matrix.architecture }}/Fritz.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Fritz-macOS-${{ matrix.architecture }}
          path: |
            artifacts/release/Fritz-macOS-${{ matrix.architecture }}.zip
            artifacts/release/Fritz-macOS-${{ matrix.architecture }}.zip.sha256
          if-no-files-found: error
